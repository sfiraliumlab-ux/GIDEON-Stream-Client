<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIDEON // P2P Сфиральный Кодек Мост</title>
    <style>
        :root {
            --bg-deep: #04060a;
            --panel-bg: #0b0e17;
            --border: #1a2236;
            --neon-cyan: #00ffcc;
            --neon-purple: #9d00ff;
            --text: #e2e8f0;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        .header {
            height: 55px; background: var(--panel-bg); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; padding: 0 20px;
            box-sizing: border-box;
        }
        .header h1 { font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; margin: 0; color: var(--neon-cyan); }
        
        .main-grid { display: flex; flex-grow: 1; height: calc(100vh - 55px); }
        
        .telecom-panel {
            width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border);
            padding: 20px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box;
        }
        .id-box {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border); padding: 12px; border-radius: 6px;
            font-family: monospace; font-size: 0.85rem;
        }
        
        .section-tag {
            font-family: monospace; font-size: 0.75rem; text-transform: uppercase; color: #52648c; margin-bottom: 5px;
        }
        
        button, label.file-label {
            width: 100%; border: 1px solid var(--border); color: white; padding: 11px; border-radius: 6px;
            font-weight: bold; cursor: pointer; transition: all 0.2s; margin-bottom: 5px;
            background: #171c3d; display: block; text-align: center; box-sizing: border-box; font-size: 0.85rem;
        }
        button:hover, label.file-label:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        
        input[type="file"] { display: none; }
        
        .projector-zone {
            flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px;
            background: radial-gradient(circle at center, #0b1124 0%, #03050a 100%);
        }
        .viewport-box {
            position: relative; background: rgba(4, 6, 10, 0.7); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
        }
        .viewport-tag {
            position: absolute; top: 15px; left: 15px; background: rgba(11,14,23,0.8);
            padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; font-family: monospace;
            border: 1px solid var(--border); z-index: 5;
        }
        canvas { width: 100%; flex-grow: 1; display: block; }
        #localVideo { display: none; }
        #hiddenCanvas { display: none; }
    </style>
</head>
<body>

    <header class="header">
        <h1>GIDEON // Сфиральный Объективный Мост</h1>
        <div id="netStatus" style="font-size: 0.8rem; font-family: monospace; color: #00ffcc;">СТАТУС: АВТОНОМНОЕ ЯДРО В СЕТИ</div>
    </header>

    <div class="main-grid">
        <aside class="telecom-panel">
            
            <!-- ПАНЕЛЬ ОТПРАВИТЕЛЯ (СЖАТИЕ И СОХРАНЕНИЕ) -->
            <div>
                <div class="section-tag">Выходной поток (Ваш узел)</div>
                <button id="toggleCamBtn">Включить камеру</button>
                <button id="btnPack" style="border-color: #bd00ff; font-weight: bold;">Запаковать Сфираль 50% (V-)</button>
            </div>

            <!-- ПАНЕЛЬ ПОЛУЧАТЕЛЯ (ИМПОРТ И РЕГЕНЕРАЦИЯ) -->
            <div>
                <div class="section-tag">Входной внешний поток</div>
                <label class="file-label" style="border-color: #00ffcc; color: #00ffcc;">
                    Загрузить внешнюю Сфираль
                    <input type="file" id="fileImport" accept=".json">
                </label>
            </div>

            <div class="id-box" style="margin-top: auto; font-size: 0.8rem;">
                <div style="color: var(--neon-purple); font-weight: bold;">МЕТРИКА ОБЪЕКТИВНОГО СЖАТИЯ:</div>
                <div style="margin-top: 5px;">Переданный файл: <span style="color: #ff4444; font-weight: bold;">Сжат на 50%</span></div>
                <div>Регенерация: <span style="color: var(--neon-cyan); font-weight: bold;">100% (V+ на клиенте)</span></div>
            </div>

            <video id="localVideo" autoplay playsinline muted></video>
            <canvas id="hiddenCanvas" width="80" height="60"></canvas>
        </aside>

        <main class="projector-zone">
            <div class="viewport-box">
                <div class="viewport-tag" style="color: #ff4444;">[ОТПРАВКА] Ваш исходящий виток V-</div>
                <canvas id="localCanvas"></canvas>
            </div>
            <div class="viewport-box">
                <div class="viewport-tag" style="color: var(--neon-cyan);">[ПРИЕМ] Объективная регенерация внешнего сигнала</div>
                <canvas id="remoteCanvas"></canvas>
            </div>
        </main>
    </div>

    <script src="./sfiral-p2p.js"></script>
    <script src="./app.js"></script>
</body>
</html>
